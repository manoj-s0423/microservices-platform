spring:
  datasource:
    url: jdbc:h2:mem:userservice;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-for-production-use
    expiration-ms: 3600000
