spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopstream_users}
    username: ${DB_USER:shopstream}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    db:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.shopstream: ${LOG_LEVEL:INFO}
